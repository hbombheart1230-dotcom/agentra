{% from "_fast08_navigation.html" import primary_navigation %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='operator.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <div class="brand-kicker">Trading Agent</div>
        <div class="brand-title">Operator Console</div>
      </div>
      {{ primary_navigation(section) }}
    </aside>
    <main class="content" id="main-content" tabindex="-1" aria-describedby="console-notice">
      <p class="console-notice" id="console-notice" role="note">Read-only observation console · No order, approval or execution controls.</p>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
