name: P1.5 Shared Offline Safety

on:
  push:
    branches: [integration/p1.5]
    paths:
      - '**/*.py'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/p15-shared-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p15-shared-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        optimized: ['', '-O']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TRADING_MODE: mock
      OPENROUTER_API_KEY: ''
      KIWOOM_APP_KEY: ''
      KIWOOM_APP_SECRET: ''
      KIWOOM_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Offline safety and role smoke tests
        run: >-
          python ${{ matrix.optimized }} -m pytest -q -p no:cacheprovider
          tests/test_real_executor_disabled.py
          tests/test_p1_3_broker_read_write_gate.py
          tests/test_step5c_execution_owner.py
          tests/test_uef9_formal_authority.py
          tests/test_m11_2_scanner.py
          tests/test_work_monitor_observation_views.py
          tests/test_trade_report_ai.py
          tests/test_operator_ui.py
