name: P1.5 Shared Candidate Required Contracts
on:
  push:
    branches:
      - integration/p1.5
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p15-shared-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
            mode: normal
            flags: ''
          - os: ubuntu-latest
            python: '3.12'
            mode: optimized
            flags: '--optimized'
          - os: windows-latest
            python: '3.13'
            mode: normal
            flags: ''
          - os: windows-latest
            python: '3.13'
            mode: optimized
            flags: '--optimized'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Resolve pinned retired-branch source trees (read-only, fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          # fetch-depth: 0 does not restore tips of deleted historical branches.
          # Do not change the audited pins, source oracles, or the pytest contract.
          for sha in \
            6849bed4af358c214f63011a0d58ef760ca79fa0 \
            c4960c5312945c8dac9b141df222f54ecc28beda \
            d269c906ebadad75a0b833778ebc6a632a388e7c \
            613a945d2b27e735d4019cdc85b4660f2c891d8f \
            3a44bed26433d03408999fb43aa45d2e4f280f55; do
            git fetch --no-tags --depth=1 origin "$sha"
            git cat-file -e "$sha^{commit}"
          done
          for pinned in \
            '6849bed4af358c214f63011a0d58ef760ca79fa0:graphs/nodes/strategist_node.py' \
            'c4960c5312945c8dac9b141df222f54ecc28beda:graphs/nodes/strategist_node.py' \
            'd269c906ebadad75a0b833778ebc6a632a388e7c:graphs/nodes/strategist_node.py' \
            '613a945d2b27e735d4019cdc85b4660f2c891d8f:apps/operator_ui/data_access_core.py' \
            '3a44bed26433d03408999fb43aa45d2e4f280f55:graphs/nodes/strategist_node.py'; do
            if ! git cat-file -e "$pinned"; then
              echo "::error::Pinned original source blob is missing: $pinned"
              exit 1
            fi
          done
      - name: Reporter R8 R10 R11, Monitor M9, all structural T3 T4, authority and mutations
        id: tests
        run: python scripts/refactor/shared_candidate_tests.py --suite all ${{ matrix.flags }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.mode }}
          path: ${{ steps.tests.outputs.evidence }}
          retention-days: 7
  api-router-compat:
    strategy:
      fail-fast: false
      matrix:
        fastapi: ['0.142.2', '0.143.0']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt fastapi==${{ matrix.fastapi }}
      - name: Actual GET endpoints and rejected POST PUT mounted endpoints
        id: tests
        run: python scripts/refactor/shared_candidate_tests.py --suite api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-router-${{ matrix.fastapi }}
          path: ${{ steps.tests.outputs.evidence }}
          retention-days: 7
