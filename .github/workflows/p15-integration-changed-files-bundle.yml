name: P1.5 Integration Changed Files Only ZIP
on:
  push:
    branches:
      - integration/p15-t4-pr5-convergence-20261015
    paths:
      - .github/workflows/p15-integration-changed-files-bundle.yml
      - docs/refactor/architecture/consumer_inventory_findings_20261015.md
      - docs/refactor/work_orders/P15-INTEGRATION-CODEX-CONSUMER-AUDIT-047.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changed-file-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ZIP tracked changed files since last verified design baseline
        run: |
          python - <<'PY'
          import subprocess, pathlib, zipfile
          base='3c716f2dedf24dd33f53994321015f2eb8cea137'
          diff=subprocess.check_output(['git','diff','--name-only','-z','--diff-filter=ACMRT',base,'HEAD'])
          files=sorted(x.decode('utf-8') for x in diff.split(b'\0') if x)
          target=pathlib.Path('p15_current_turn_modified_only.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in files:
                  p=pathlib.Path(f)
                  if p.is_file(): z.write(p,arcname=f)
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              assert len(z.namelist())==len(files)
          print('ONLY_CHANGED_FILES='+str(len(files)), 'ZIP_BYTES='+str(target.stat().st_size))
          print('FILES='+','.join(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p15-current-turn-modified-only
          path: p15_current_turn_modified_only.zip
          retention-days: 7
