name: P1.5.1 Baseline Full Validation
on:
  pull_request:
    branches:
      - ci/p151-baseline-full-20261007
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Full pytest baseline
        run: python -m pytest -q
