  windows-harness-smoke:
    name: Windows harness isolation smoke (required)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && python -m pip install pytest
      - name: Windows parity-harness isolation tests (real session_env, interpreter preflight, placeholder fail-closed)
        shell: bash
        run: |
          mkdir -p branch_output
          # NTFS settles directory timestamps lazily on a FRESH checkout: the conftest fast-tier write audit sees the
          # directory entries of data/eval, data/originals and data/specs 'change' by ~2 ms between its own start and
          # finish although nothing wrote there (T3-0.2). One throw-away collect-only session lets them settle; its
          # result is NOT used. The real run below keeps the full write audit and must be clean.
          # T3-0.3 (P2 stays UNRESOLVED): record the facts - directory mtime samples BEFORE the settle session and the
          # exit code / banner of the settle session itself - so reproducibility is visible per run. Diagnostic only.
          python scripts/refactor/p160_ntfs_dir_mtime_diagnostics.py probe --out branch_output/ntfs_probe_before_settle.json
          settle_rc=0
          python -m pytest -q -p no:cacheprovider --collect-only tests/test_p156_parity_harness.py > branch_output/harness_windows_settle.log 2>&1 || settle_rc=$?
          tail -n 25 branch_output/harness_windows_settle.log
          python scripts/refactor/p160_ntfs_dir_mtime_diagnostics.py summarize-settle branch_output/harness_windows_settle.log $settle_rc --out branch_output/ntfs_settle_summary.json
          rc=0
          python -m pytest -q -p no:cacheprovider tests/test_p156_parity_harness.py -rs --junitxml=branch_output/harness_windows_junit.xml > branch_output/harness_windows_pytest.log 2>&1 || rc=$?
          cat branch_output/harness_windows_pytest.log
          python - <<'PY'
          t = open('branch_output/harness_windows_pytest.log', encoding='utf-8', errors='replace').read()[-7000:]
          t = t.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
          print('::notice title=windows-harness-pytest-tail::' + t)
          PY
          exit $rc
      - name: Windows-only tests must have RUN and PASSED (a skip is a failure here)
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          rows = [(c.get('name'), 'SKIPPED' if c.find('skipped') is not None else 'FAILED' if c.find('failure') is not None or c.find('error') is not None else 'PASSED')
                  for c in ET.parse('branch_output/harness_windows_junit.xml').iter('testcase')]
          win = [r for r in rows if 'windows' in r[0]]
          print('WINDOWS harness tests:', len(rows), 'Windows-only:', win)
          required = {'test_windows_unresolved_placeholder_prefix_is_the_hazard_it_is_claimed_to_be',
                      'test_windows_real_session_env_leaves_no_clone_root_debris_for_every_available_interpreter'}
          got = {n: s for n, s in win}
          for name in required:
              assert got.get(name) == 'PASSED', (name, got.get(name))
          assert not [n for n, s in win if s == 'FAILED'], win
          # T3-0.3: the write-containment negative tests must have RUN and PASSED on Windows (never skipped)
          cont = [(n, s) for n, s in rows if n.startswith(('test_containment_', 'test_security_', 'test_export_',
                                                           'test_retention_', 'test_cleanup_refuses'))]
          print('WINDOWS containment tests:', len(cont))
          assert len(cont) >= 85, len(cont)
          assert len([n for n, _ in cont if n.startswith('test_export_')]) >= 52
          assert all(s == 'PASSED' for _, s in cont), [r for r in cont if r[1] != 'PASSED']
          need = ['content_modified', 'file_deleted', 'empty_directory_deleted', 'mtime_only', 'same_size_content',
                  'same_size_content_restored_mtime', 'new_file', 'type_changed']
          names = [n for n, _ in cont]
          for k in need:
              assert any(n.endswith('[' + k + ']') for n in names), k
          PY
      - name: Upload Windows harness JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p15-windows-harness-junit
          path: |
            branch_output/harness_windows_junit.xml
            branch_output/harness_windows_pytest.log
            branch_output/harness_windows_settle.log
            branch_output/ntfs_probe_before_settle.json
            branch_output/ntfs_settle_summary.json
          if-no-files-found: warn
  broad_remote_offline:
    name: Repo-wide mock/offline non-heavy regression (manual diagnostic only)
    if: github.event_name == 'workflow_dispatch'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
      TRADING_MODE: 'mock'
      OPENROUTER_API_KEY: ''
      KIWOOM_APP_KEY: ''
      KIWOOM_APP_SECRET: ''
      KIWOOM_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch pinned historic public facade AST baselines in separate sweep job
        run: |
          for commit in \
            2fb4b8fcbaa68c34e80fbdbeb8e009c66d0cbc7c \
            f381772d2118aca6444108fab429e4a0e0fba056 \
            0da31c9e6bbcf1754e1b9b209878dca1c6eda9e3 \
            df57b57acf6380174189ed4b69b3f9f92c638d02 \
            007e7c2ff757181048bac6d467ff76ec9f4ddce1 \
            9242d6e30c1c9917bf434bed99e7cca373876678 \
            52508ade9d0d246fa4e848525fe62f2fe067acb7 \
            183924bdbe2e51723987436b45a48d0e849724db \
            ef22bec761d7f2b01762cb17e3c6523b9df8040c \
            0409687aa76e195bd001d7756419b86b9580c531; do
            git fetch --no-tags --depth=1 origin "$commit"
          done
      - name: Repo-wide offline pytest excluding declared heavy, docker and benchmark
        run: |
          mkdir -p branch_output
          python -m pytest -q tests -m "not heavy and not docker and not benchmark" --disable-warnings --junitxml=branch_output/p152_repo_safe_sweep_junit.xml
      - name: Isolate broad-sweep API route failure in fresh pytest process
        if: always()
        run: python -m pytest -q tests/apps/api/test_isolation.py::test_api_routes_are_get_only
      - name: Preserve offline repo-wide test evidence even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p152-repo-wide-offline-sweep-junit
          retention-days: 14
          if-no-files-found: warn
          path: branch_output/p152_repo_safe_sweep_junit.xml


