name: P1.5 Reporting Regression + P1.5 Design Guard
on:
  push:
    branches:
      - integration/p1.5
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate P1.5 owner-size design and UI patch history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          j=json.loads((root/"docs/trading_agent_patch_notes_detailed_update/patch_notes.json").read_text(encoding="utf-8"))
          assert j["entry_count"]==len(j["entries"])
          key="P1.5 Small-Owner and Executor v1.2"
          entry=[e for e in j["entries"] if e.get("version")==key]
          assert len(entry)==1
          assert all((root/p).is_file() for p in entry[0]["sources"])
          docs=["p1_5_small_owner_policy_and_rollback_decision_v1_2.md",
                "p1_5_reporting_implementation_packet_v1_2.md",
                "p1_5_executor_safe_decomposition_packet_v1_1.md"]
          for name in docs:
              assert (root/"docs/refactor"/name).is_file()
          policy=(root/"docs/refactor"/docs[0]).read_text(encoding="utf-8")
          exe=(root/"docs/refactor"/docs[2]).read_text(encoding="utf-8")
          for key in ["350 physical LOC", "CONTINUE", "R2-A", "R2-C"]:
              assert key in policy, key
          for key in ["EX7", "EX8", "EX9", "EX10", "1,200", "1,800", "R6.2", "Step5C"]:
              assert key in exe, key
          assert "P1.5 Small-Owner and Executor v1.2" in (root/"docs/trading_agent_patch_notes_detailed_update/patch_notes.md").read_text(encoding="utf-8")
          print("P1.5 DESIGN GUARD PASS —", j["entry_count"], "patch note entries")
          PY
      - name: Validate live D00 DOC-FIRST contract and historical preservation
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path(".")
          paths={
              "d00": "docs/ENGINEERING_DELIVERY_POLICY.md",
              "codex": "AGENTS.md",
              "claude": "CLAUDE.md",
              "readme": "docs/refactor/README.md",
              "current": "docs/refactor/work_orders/CURRENT.md",
              "rules": "docs/refactor/work_orders/COMMON_RULES.md",
              "target": "docs/refactor/architecture/TREE_V3_FROZEN.md",
              "registry": "docs/refactor/DOC_REGISTRY.csv",
              "protocol": "docs/refactor/P15_EXECUTION_PROTOCOL.md",
              "size": "docs/refactor/p1_5_small_owner_policy_and_rollback_decision_v1_2.md",
              "roadmap": "docs/refactor/p1_5_p1_6_master_plan.md",
          }
          for item in paths.values():
              assert (root/item).is_file(), item
          read=lambda name:(root/paths[name]).read_text(encoding="utf-8")
          d00,cl,cx=read("d00"),read("claude"),read("codex")
          overview,current,rules=read("readme"),read("current"),read("rules")
          target,protocol,size=read("target"),read("protocol"),read("size")
          assert "D00" in d00 and "DELIVERY FIRST" in d00
          for cli in (cl,cx):
              assert "docs/refactor/work_orders/CURRENT.md" in cli
              assert "Issues #16–#19 are CLOSED" in cli, "closed historical work queue must not reactivate"
              assert "REVIEW_ONLY_NO_NESTED_CLI" in cli, "read-only peer-review gate missing"
              assert "DOC_FREEZE" in cli, "CLI must enforce docs-first"
          assert "integration/p1.5" in current and "DOC-A" in current
          assert "DOC_FREEZE" in current and "Issue #20" in current, "current pointer must honor phase gate and issue authority"
          assert "FINAL_ACCEPTED" not in current, "CURRENT must not claim release acceptance before DOC_FREEZE"
          assert "DOC_FREEZE" in overview and "DOC_FREEZE" in rules
          assert "docs/ENGINEERING_DELIVERY_POLICY.md" in d00
          assert "DIRECT CROSS-CLI RELAY" in d00, "D00 dual-development protocol missing"
          assert "claude -p" in cx and "codex exec" in cl, "D01/D02 direct opposite-CLI review missing"
          assert "libs/agents/{commander,strategist,scanner,monitor,reporter,supervisor,executor}/" in target
          assert "HISTORICAL PROCEDURE / NOT A LIVE WORK ORDER" in protocol
          assert "HISTORICAL IMPLEMENTATION ACCEPTANCE POLICY" in size
          assert "P1.5.2 OPEN" in current and "P1.5.3" in current, "pinned provenance markers lost"
          with (root/paths["registry"]).open(encoding="utf-8",newline="") as handle:
              rows=list(csv.DictReader(handle))
          assert len(rows)==339, "original 339 document registry must remain conserved"
          registered=[row["path"] for row in rows]
          assert len(set(registered))==339, "duplicate original registry path"
          assert all((root/path).is_file() for path in registered), "registered source missing"
          assert all(row["activation"]=="NO" for row in rows), "historical work reactivated"
          notes=json.loads((root/"docs/trading_agent_patch_notes_detailed_update/patch_notes.json").read_text(encoding="utf-8"))
          assert notes["entry_count"]==len(notes["entries"]), "patchnote entry_count"
          known_historical_missing = {
              "data/logs/events.jsonl",
              "data/logs/execution_readiness_evidence/2026-10-08.jsonl",
              "deploy/compose/.env",
              "docs/01_overview.md",
              "docs/02_principles.md",
              "docs/05_runtime_flow.md",
              "docs/07_execution_and_guards.md",
              "docs/08_observability.md",
              "libs/event_logger.py",
              "reports/evaluation/alpha_research_board/2026-10-08/generations/UEF9RUN_559c27f2d0d1f62b/COMPLETE.json",
              "reports/evaluation/baseline_btc_woori",
              "reports/evaluation/baseline_samsung_hynix",
              "reports/operator_summary/daily/2026-10-06/daily_report.md",
              "reports/operator_summary/daily/2026-10-08/closeout_maintenance.json",
          }
          versions = [e.get("version") for e in notes["entries"]]
          titles = [e.get("title") for e in notes["entries"]]
          assert all(isinstance(x, str) and x for x in versions + titles), "empty patch-note identity"
          assert len(set(versions)) == len(versions), "duplicate patch-note version"
          assert len(set(titles)) == len(titles), "duplicate patch-note title"
          absent = []
          for entry in notes["entries"]:
              assert isinstance(entry.get("sources"), list), entry.get("version")
              for src in entry["sources"]:
                  assert isinstance(src, str) and src, entry.get("version")
                  if src.startswith("https://"):
                      assert src.startswith("https://github.com/hbombheart1230-dotcom/agentra/"), src
                      continue
                  assert not Path(src).is_absolute() and ".." not in Path(src).parts, src
                  if not (root / src).exists():
                      absent.append((entry["version"], src))
                      assert src in known_historical_missing, ("new missing patch-note source", entry["version"], src)
          assert len(absent) == 16, ("historical missing-source occurrence drift", absent)
          assert {src for _, src in absent} == known_historical_missing, "historical provenance set drift"
          assert (root / "docs/refactor/DOC_PATCHNOTE_SOURCE_PROVENANCE_20261019.md").is_file()
          md=(root/"docs/trading_agent_patch_notes_detailed_update/patch_notes.md").read_text(encoding="utf-8")
          assert notes["entries"][-1]["date"] in md, "historical entry not in Markdown"
          assert notes["entries"][0]["date"] in md, "current entry not in Markdown"
          assert notes["entries"][0]["version"] in md, "latest JSON/Markdown version mismatch"
          for wfp in sorted((root/".github/workflows").glob("*.yml")):
              wf=wfp.read_text(encoding="utf-8")
              assert ("Zip"+"File") not in wf and ("."+"zip") not in wf, f"CI ZIP packaging forbidden: {wfp}"
          print("DOC-FIRST AUTHORITY & HISTORICAL CONTRACT PASS",len(rows),notes["entry_count"])
          PY
