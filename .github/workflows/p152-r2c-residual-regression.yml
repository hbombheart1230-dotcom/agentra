      TRADING_MODE: 'mock'
      OPENROUTER_API_KEY: ''
      KIWOOM_APP_KEY: ''
      KIWOOM_APP_SECRET: ''
      KIWOOM_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
