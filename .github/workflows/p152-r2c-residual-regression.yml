  broad_remote_offline:
    name: Repo-wide mock/offline non-heavy regression (manual diagnostic only)
    if: github.event_name == 'workflow_dispatch'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
      TRADING_MODE: 'mock'
      OPENROUTER_API_KEY: ''
      KIWOOM_APP_KEY: ''
      KIWOOM_APP_SECRET: ''
      KIWOOM_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch pinned historic public facade AST baselines in separate sweep job
        run: |
          for commit in \
            2fb4b8fcbaa68c34e80fbdbeb8e009c66d0cbc7c \
            f381772d2118aca6444108fab429e4a0e0fba056 \
            0da31c9e6bbcf1754e1b9b209878dca1c6eda9e3 \
            df57b57acf6380174189ed4b69b3f9f92c638d02 \
            007e7c2ff757181048bac6d467ff76ec9f4ddce1 \
            9242d6e30c1c9917bf434bed99e7cca373876678 \
            52508ade9d0d246fa4e848525fe62f2fe067acb7 \
            183924bdbe2e51723987436b45a48d0e849724db \
            ef22bec761d7f2b01762cb17e3c6523b9df8040c \
            0409687aa76e195bd001d7756419b86b9580c531; do
            git fetch --no-tags --depth=1 origin "$commit"
          done
      - name: Repo-wide offline pytest excluding declared heavy, docker and benchmark
        run: |
          mkdir -p branch_output
          python -m pytest -q tests -m "not heavy and not docker and not benchmark" --disable-warnings --junitxml=branch_output/p152_repo_safe_sweep_junit.xml
      - name: Isolate broad-sweep API route failure in fresh pytest process
        if: always()
        run: python -m pytest -q tests/apps/api/test_isolation.py::test_api_routes_are_get_only
      - name: Preserve offline repo-wide test evidence even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p152-repo-wide-offline-sweep-junit
          retention-days: 14
          if-no-files-found: warn
          path: branch_output/p152_repo_safe_sweep_junit.xml


  windows_prelocal_diagnostics:
    name: Windows hosted path/lock/UI compatibility (manual diagnostic)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
      TRADING_MODE: 'mock'
      OPENROUTER_API_KEY: ''
      KIWOOM_APP_KEY: ''
      KIWOOM_APP_SECRET: ''
      KIWOOM_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Hosted Windows strict owner lock and platform path tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force branch_output | Out-Null
          python -m pytest -q tests/test_closeout_single_owner_guard.py tests/test_market_data_receipts.py tests/test_operator_ui.py tests/test_runtime_entrypoint_common.py tests/test_windows_subprocess.py --disable-warnings --maxfail=15 --junitxml=branch_output/p152_windows_platform_junit.xml
      - name: Hosted Windows API and scanner isolation diagnostics
        if: always()
        shell: pwsh
        run: python -m pytest -q tests/apps/api/test_isolation.py::test_api_routes_are_get_only tests/test_scanner_rank_plumbing_fix.py --disable-warnings
      - name: Upload hosted Windows diagnostic results even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p152-windows-hosted-platform-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: branch_output/p152_windows_platform_junit.xml
