name: P1.5 Reporting Regression + P1.5 Design Guard
on:
  push:
    branches:
      - refactor/p1.5
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate P1.5 owner-size design and UI patch history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          j=json.loads((root/"docs/trading_agent_patch_notes_detailed_update/patch_notes.json").read_text(encoding="utf-8"))
          assert j["entry_count"]==len(j["entries"])
          key="P1.5 Small-Owner and Executor v1.2"
          entry=[e for e in j["entries"] if e.get("version")==key]
          assert len(entry)==1
          assert all((root/p).is_file() for p in entry[0]["sources"])
          docs=["p1_5_small_owner_policy_and_rollback_decision_v1_2.md",
                "p1_5_reporting_implementation_packet_v1_2.md",
                "p1_5_executor_safe_decomposition_packet_v1_1.md"]
          for name in docs:
              assert (root/"docs/refactor"/name).is_file()
          policy=(root/"docs/refactor"/docs[0]).read_text(encoding="utf-8")
          exe=(root/"docs/refactor"/docs[2]).read_text(encoding="utf-8")
          for key in ["350 physical LOC", "CONTINUE", "R2-A", "R2-C"]:
              assert key in policy, key
          for key in ["EX7", "EX8", "EX9", "EX10", "1,200", "1,800", "R6.2", "Step5C"]:
              assert key in exe, key
          assert "P1.5 Small-Owner and Executor v1.2" in (root/"docs/trading_agent_patch_notes_detailed_update/patch_notes.md").read_text(encoding="utf-8")
          print("P1.5 DESIGN GUARD PASS —", j["entry_count"], "patch note entries")
          PY
      - name: Validate Git-driven work order and independent roles
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          paths=[
              "CLAUDE.md", "AGENTS.md",
              "docs/refactor/P15_EXECUTION_PROTOCOL.md",
              "docs/refactor/work_orders/README.md",
              "docs/refactor/work_orders/CURRENT.md",
          ]
          for name in paths:
              assert Path(name).is_file(), name
          cl=Path("CLAUDE.md").read_text(encoding="utf-8")
          cx=Path("AGENTS.md").read_text(encoding="utf-8")
          cur=Path("docs/refactor/work_orders/CURRENT.md").read_text(encoding="utf-8")
          protocol=Path("docs/refactor/P15_EXECUTION_PROTOCOL.md").read_text(encoding="utf-8")
          assert "docs/refactor/work_orders/CURRENT.md" in cl
          assert "docs/refactor/work_orders/CURRENT.md" in cx
          assert "P15-R2-GPT-VERIFY-002" in cur
          assert "READ-ONLY LOCAL VERIFICATION" in cur
          assert "NO RUNTIME PYTHON EDITS" in cur
          assert "CODEX" in protocol and "CLAUDE" in protocol and "GPT_ACCEPTED" in protocol
          notes=json.loads(Path("docs/trading_agent_patch_notes_detailed_update/patch_notes.json").read_text(encoding="utf-8"))
          assert notes["entry_count"]==len(notes["entries"])
          key="P1.5 Git-Driven Claude/Codex Work Orders v1.0"
          matching=[e for e in notes["entries"] if e.get("version")==key]
          assert len(matching)==1
          assert all(Path(src).is_file() for src in matching[0]["sources"])
          assert key in Path("docs/trading_agent_patch_notes_detailed_update/patch_notes.md").read_text(encoding="utf-8")
          print("P1.5 GIT WORK ORDER GUARD PASS",notes["entry_count"])
          PY
      - name: Fetch pinned P1.5.2 before-source for deterministic owner parity
        run: git fetch --no-tags --depth=1 origin 2fb4b8fcbaa68c34e80fbdbeb8e009c66d0cbc7c
      - name: Fetch pre-Owner27 public Story façade for parity
        run: git fetch --no-tags --depth=1 origin f381772d2118aca6444108fab429e4a0e0fba056
      - name: Fetch pre-Owner28 Story human explanations for AST parity
        run: git fetch --no-tags --depth=1 origin 0da31c9e6bbcf1754e1b9b209878dca1c6eda9e3
      - name: Fetch pre-Owner29 Story contract source for AST parity
        run: git fetch --no-tags --depth=1 origin df57b57acf6380174189ed4b69b3f9f92c638d02
      - name: Fetch pre-Owner30 Markdown Clean for pinned AST parity
        run: git fetch --no-tags --depth=1 origin 007e7c2ff757181048bac6d467ff76ec9f4ddce1
      - name: Fetch pre-Owner31 AI Reporter source for pinned AST parity
        run: git fetch --no-tags --depth=1 origin 9242d6e30c1c9917bf434bed99e7cca373876678
      - name: Fetch original Markdown Clean facade for Owner32-33 parity
        run: git fetch --no-tags --depth=1 origin 52508ade9d0d246fa4e848525fe62f2fe067acb7
      - name: Fetch initial public ABI baseline for Owner34
        run: git fetch --no-tags --depth=1 origin 52508ade9d0d246fa4e848525fe62f2fe067acb7
      - name: Fetch pre-Owner35 AI facade for exact label source parity
        run: git fetch --no-tags --depth=1 origin 183924bdbe2e51723987436b45a48d0e849724db
      - name: Check 38 extracted function ASTs and <=350 LOC Owners
        run: python -m scripts.refactor.p152_owner_parity
      - name: Compile extracted owners
        run: python -m compileall -q libs/reporting/trade_story_pipeline.py libs/reporting/trade_story_pipeline_news.py libs/reporting/trade_story_pipeline_scanner.py libs/reporting/trade_story_pipeline_provenance.py
      - name: Broader reporting regression
        run: python -m pytest -q tests/test_trade_report_ai.py tests/test_trade_summary_symbol_metadata.py tests/test_reporting_provenance_preference.py tests/test_trade_report_ai_separated_adapter.py tests/test_run_ai_trade_report_batch.py tests/test_live_execution_bundle_report.py tests/test_live_execution_bundle_report_runtime_recovery.py tests/test_report_metadata_alignment.py tests/test_check_trade_report_runtime_regression.py tests/test_intraday_trade_reports.py tests/test_single_trade_report.py tests/test_symbol_trade_report.py tests/apps/api/test_trade_reports.py tests/test_m25_3_alert_reporting_closeout.py tests/test_trade_story_pipeline_enrichment.py tests/test_phase3_lifecycle_bundle.py
      - name: Helper-seam and UI patch-notes regression
        run: python -m pytest -q tests/test_p152_summary_input_part_owners.py tests/test_p152_markdown_render_section_owners.py tests/test_p152_new_owner_dependency_gate.py tests/test_p152_monitor_trace_wrappers.py tests/test_p152_render_diagnostics_owner.py tests/test_p152_monitor_context_owner.py tests/test_p152_monitor_entry_review_owner.py tests/test_p152_monitor_policy_bullets_owner.py tests/test_p152_summary_findings_owner.py tests/test_p152_operator_language_owner.py tests/test_p152_operator_phrase_owners.py tests/test_p152_monitor_diagnostics_owner.py tests/test_p152_ai_facade_market_scanner_labels.py tests/test_p152_facade_abi_and_authority_boundary.py tests/test_p152_markdown_clean_operator_labels_owners.py tests/test_p152_ai_facade_text_helpers.py tests/test_p152_markdown_clean_summary_language_owner.py tests/test_p152_story_facade_contract_owners.py tests/test_p152_story_facade_human_owners.py tests/test_p152_story_facade_compatible_owners.py tests/test_p152_facade_consumer_static_index.py tests/test_p152_facade_symbol_ledger.py tests/test_p152_lifecycle_evidence_owner.py tests/test_p152_direct_story_owner.py tests/test_p152_story_reasoning_owner.py tests/test_p152_lifecycle_human_owner.py tests/test_p152_r2c_helper_seams.py tests/test_patch_notes_sync.py tests/apps/api/test_patch_notes.py
      - name: Produce conservative whole-repository façade consumer index
        run: python -m scripts.refactor.p152_facade_consumer_scan --out branch_output/p152_facade_consumer_static_coverage.json
      - name: Upload static façade consumer evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p152-facade-consumer-static
          retention-days: 14
          if-no-files-found: error
          path: branch_output/p152_facade_consumer_static_coverage.json
      - name: Pack only P1.5.2 files changed since pinned GPT baseline
        if: success()
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          files = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", "2fb4b8fcbaa68c34e80fbdbeb8e009c66d0cbc7c", "HEAD"]
          ).decode().split("\0")
          files = [p for p in files if p and Path(p).is_file()]
          assert files, "No tracked changed files"
          Path("branch_output").mkdir(exist_ok=True)
          with ZipFile("branch_output/p152_refactor_modified_only.zip", "w", ZIP_DEFLATED) as out:
              for name in files:
                  out.write(name, arcname=name)
          print("ZIP ENTRIES:", *files, sep="\n- ")
          PY
      - name: Upload changed-files ZIP only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p152-only-modified-files
          retention-days: 14
          if-no-files-found: error
          path: branch_output/p152_refactor_modified_only.zip
