name: P1.5 Reporting Regression + P1.5 Design Guard
on:
  push:
    branches:
      - refactor/p1.5
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate P1.5 owner-size design and UI patch history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          j=json.loads((root/"docs/trading_agent_patch_notes_detailed_update/patch_notes.json").read_text(encoding="utf-8"))
          assert j["entry_count"]==len(j["entries"])
          key="P1.5 Small-Owner and Executor v1.2"
          entry=[e for e in j["entries"] if e.get("version")==key]
          assert len(entry)==1
          assert all((root/p).is_file() for p in entry[0]["sources"])
          docs=["p1_5_small_owner_policy_and_rollback_decision_v1_2.md",
                "p1_5_reporting_implementation_packet_v1_2.md",
                "p1_5_executor_safe_decomposition_packet_v1_1.md"]
          for name in docs:
              assert (root/"docs/refactor"/name).is_file()
          policy=(root/"docs/refactor"/docs[0]).read_text(encoding="utf-8")
          exe=(root/"docs/refactor"/docs[2]).read_text(encoding="utf-8")
          for key in ["350 physical LOC", "CONTINUE", "R2-A", "R2-C"]:
              assert key in policy, key
          for key in ["EX7", "EX8", "EX9", "EX10", "1,200", "1,800", "R6.2", "Step5C"]:
              assert key in exe, key
          assert "P1.5 Small-Owner and Executor v1.2" in (root/"docs/trading_agent_patch_notes_detailed_update/patch_notes.md").read_text(encoding="utf-8")
          print("P1.5 DESIGN GUARD PASS —", j["entry_count"], "patch note entries")
          PY
      - name: Validate Fast Track active work-order contract and independent roles
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          for name in ["CLAUDE.md", "AGENTS.md", "docs/refactor/P15_EXECUTION_PROTOCOL.md",
                       "docs/refactor/work_orders/README.md", "docs/refactor/work_orders/CURRENT.md",
                       "docs/refactor/work_orders/COMMON_RULES.md",
                       "docs/refactor/P15_FAST_TRACK_FIRST_PASS_2026_10_12.md"]:
              assert Path(name).is_file(), name
          cl = Path("CLAUDE.md").read_text(encoding="utf-8")
          cx = Path("AGENTS.md").read_text(encoding="utf-8")
          cur = Path("docs/refactor/work_orders/CURRENT.md").read_text(encoding="utf-8")
          rules = Path("docs/refactor/work_orders/COMMON_RULES.md").read_text(encoding="utf-8")
          plan = Path("docs/refactor/P15_FAST_TRACK_FIRST_PASS_2026_10_12.md").read_text(encoding="utf-8")
          protocol = Path("docs/refactor/P15_EXECUTION_PROTOCOL.md").read_text(encoding="utf-8")
          assert "docs/refactor/work_orders/CURRENT.md" in cl and "docs/refactor/work_orders/CURRENT.md" in cx
          assert "CLAUDE IMPLEMENTS" in cx and "CODEX INDEPENDENT" in cx and "CLAUDE PRIMARY IMPLEMENTER" in cl
          assert "CODEX" in protocol and "CLAUDE" in protocol and "GPT_ACCEPTED" in protocol
          # ONE active Fast Track work order: CURRENT links exactly one existing P15_FAST_TRACK_WAVE_*.md
          links = sorted(set(re.findall(r"\(?(P15_FAST_TRACK_WAVE_[A-Z]_\d+\.md)\)?", cur)))
          assert len(links) == 1, links
          assert (Path("docs/refactor/work_orders") / links[0]).is_file(), links[0]
          # approved scope + state: single branch, main frozen, no ZIP, never a FINAL acceptance claim
          state = re.search(r"^\*\*State:\*\*(.*)$", cur, flags=re.M)
          assert state, "CURRENT.md has no **State:** line"
          assert "FINAL_ACCEPTED" not in state.group(1), state.group(1)
          assert "refactor/p1.5" in cur and ("MAIN_FROZEN" in cur or "main` frozen" in cur)
          assert "No ZIP" in cur or "no ZIP" in cur
          assert "FIRST_PASS_WITH_DEBT" in plan and "Fast Track execution rules" in rules
          assert "No ZIP" in rules or "no ZIP" in rules
          wf = Path(".github/workflows/p152-r2c-residual-regression.yml").read_text(encoding="utf-8")
          assert ("Zip" + "File") not in wf and ("." + "zip") not in wf, "ZIP packaging must not exist in CI"
          notes = json.loads(Path("docs/trading_agent_patch_notes_detailed_update/patch_notes.json").read_text(encoding="utf-8"))
          assert notes["entry_count"] == len(notes["entries"])
          for entry in notes["entries"][-5:]:
              assert all(Path(src).is_file() for src in entry["sources"]), entry["version"]
          md = Path("docs/trading_agent_patch_notes_detailed_update/patch_notes.md").read_text(encoding="utf-8")
          assert notes["entries"][-1]["date"] in md
          print("P1.5 FAST TRACK CONTRACT GUARD PASS", links[0], notes["entry_count"])
          PY
      - name: Fetch pinned P1.5.2 before-source for deterministic owner parity
        run: git fetch --no-tags --depth=1 origin 2fb4b8fcbaa68c34e80fbdbeb8e009c66d0cbc7c
      - name: Fetch pre-Owner27 public Story façade for parity
        run: git fetch --no-tags --depth=1 origin f381772d2118aca6444108fab429e4a0e0fba056
      - name: Fetch pre-Owner28 Story human explanations for AST parity
        run: git fetch --no-tags --depth=1 origin 0da31c9e6bbcf1754e1b9b209878dca1c6eda9e3
      - name: Fetch pre-Owner29 Story contract source for AST parity
        run: git fetch --no-tags --depth=1 origin df57b57acf6380174189ed4b69b3f9f92c638d02
      - name: Fetch pre-Owner30 Markdown Clean for pinned AST parity
        run: git fetch --no-tags --depth=1 origin 007e7c2ff757181048bac6d467ff76ec9f4ddce1
      - name: Fetch pre-Owner31 AI Reporter source for pinned AST parity
        run: git fetch --no-tags --depth=1 origin 9242d6e30c1c9917bf434bed99e7cca373876678
      - name: Fetch original Markdown Clean facade for Owner32-33 parity
        run: git fetch --no-tags --depth=1 origin 52508ade9d0d246fa4e848525fe62f2fe067acb7
      - name: Fetch initial public ABI baseline for Owner34
        run: git fetch --no-tags --depth=1 origin 52508ade9d0d246fa4e848525fe62f2fe067acb7
      - name: Fetch pre-Owner35 AI facade for exact label source parity
        run: git fetch --no-tags --depth=1 origin 183924bdbe2e51723987436b45a48d0e849724db
      - name: Fetch original AI Reporter before Owner37 duration/grammar split
        run: git fetch --no-tags --depth=1 origin ef22bec761d7f2b01762cb17e3c6523b9df8040c
      - name: Fetch original Markdown Clean before Owner38 headline split
        run: git fetch --no-tags --depth=1 origin 0409687aa76e195bd001d7756419b86b9580c531
      - name: Fetch Wave A end commit for the stage-scoped scope guard and moved-body gates
        run: git fetch --no-tags --depth=1 origin 318015a02b8378b0dbf7b0b24ec18c2786688d18 fb8de628eb56b0941007e90ad2e98b4f684983ba ba6618d483e6d617f4ee56b2cb5647392c777071
      - name: Check 38 extracted function ASTs and <=350 LOC Owners
        run: python -m scripts.refactor.p152_owner_parity
      - name: Compile extracted owners
        run: python -m compileall -q libs/reporting/trade_story_pipeline.py libs/reporting/trade_story_pipeline_news.py libs/reporting/trade_story_pipeline_scanner.py libs/reporting/trade_story_pipeline_provenance.py
      - name: Broader reporting regression
        run: python -m pytest -q tests/test_trade_report_ai.py tests/test_trade_summary_symbol_metadata.py tests/test_reporting_provenance_preference.py tests/test_trade_report_ai_separated_adapter.py tests/test_run_ai_trade_report_batch.py tests/test_live_execution_bundle_report.py tests/test_live_execution_bundle_report_runtime_recovery.py tests/test_report_metadata_alignment.py tests/test_check_trade_report_runtime_regression.py tests/test_intraday_trade_reports.py tests/test_single_trade_report.py tests/test_symbol_trade_report.py tests/apps/api/test_trade_reports.py tests/test_m25_3_alert_reporting_closeout.py tests/test_trade_story_pipeline_enrichment.py tests/test_phase3_lifecycle_bundle.py
      - name: Helper-seam and UI patch-notes regression
        run: python -m pytest -q tests/test_p152_summary_input_part_owners.py tests/test_p152_markdown_render_section_owners.py tests/test_p152_new_owner_dependency_gate.py tests/test_p152_monitor_trace_wrappers.py tests/test_p152_render_diagnostics_owner.py tests/test_p152_monitor_context_owner.py tests/test_p152_monitor_entry_review_owner.py tests/test_p152_monitor_policy_bullets_owner.py tests/test_p152_summary_findings_owner.py tests/test_p152_operator_language_owner.py tests/test_p152_operator_phrase_owners.py tests/test_p152_monitor_diagnostics_owner.py tests/test_p152_ai_facade_market_scanner_labels.py tests/test_p152_ai_duration_language_owner.py tests/test_p152_facade_abi_and_authority_boundary.py tests/test_p152_markdown_clean_operator_labels_owners.py tests/test_p152_markdown_clean_news_headlines_owner.py tests/test_p152_ai_facade_text_helpers.py tests/test_p152_markdown_clean_summary_language_owner.py tests/test_p152_story_facade_contract_owners.py tests/test_p152_story_facade_human_owners.py tests/test_p152_story_facade_compatible_owners.py tests/test_p152_facade_consumer_static_index.py tests/test_p152_facade_symbol_ledger.py tests/test_p152_lifecycle_evidence_owner.py tests/test_p152_direct_story_owner.py tests/test_p152_story_reasoning_owner.py tests/test_p152_lifecycle_human_owner.py tests/test_p152_r2c_helper_seams.py tests/test_patch_notes_sync.py tests/apps/api/test_patch_notes.py
      - name: Expanded offline Reporting integration surfaces (no live broker or LLM)
        env:
          DRY_RUN: '1'
          TRADING_MODE: 'mock'
        run: python -m pytest -q tests/test_reporter_agent_trade_entrypoint.py tests/test_reporter_node.py tests/test_reporter_service.py tests/test_reporter_analysis_report.py tests/test_reporter_feedback.py tests/test_reporter_commander_hooks.py tests/test_reporter_script_wrappers.py tests/test_trade_explain_report.py tests/test_operator_summary_reports.py tests/test_controlled_mock_lane_report.py tests/test_agent_pipeline_trace_report.py tests/test_report_trades_continuity.py tests/test_check_reporter_upgrade_regression.py tests/test_m19_6_llm_daily_report.py
      - name: Gate moved_body_reporting (test_p152_r3_moved_bodies.py)
        run: |
          mkdir -p branch_output
          python -m pytest -q tests/test_p152_r3_moved_bodies.py --junitxml=branch_output/gate_moved_body_reporting_junit.xml
      - name: Gate moved_body_operator_ui (test_p153_operator_ui_moved_bodies.py)
        run: |
          mkdir -p branch_output
          python -m pytest -q tests/test_p153_operator_ui_moved_bodies.py --junitxml=branch_output/gate_moved_body_operator_ui_junit.xml
      - name: Gate harness_guards (test_p152_r3_harness_guards.py)
        run: |
          mkdir -p branch_output
          set +e
          python -m pytest -q tests/test_p152_r3_harness_guards.py --tb=short --junitxml=branch_output/gate_harness_guards_junit.xml > branch_output/harness_guards.log 2>&1
          code=$?
          set -e
          grep -E "^(FAILED|ERROR) |^E  " branch_output/harness_guards.log | head -40 | while IFS= read -r line; do echo "::error::${line:0:380}"; done
          tail -n 3 branch_output/harness_guards.log
          exit $code
      - name: Gate symbol_ledger (test_p152_facade_symbol_ledger.py)
        run: |
          mkdir -p branch_output
          python -m pytest -q tests/test_p152_facade_symbol_ledger.py --junitxml=branch_output/gate_symbol_ledger_junit.xml
      - name: Gate scope_abi_guards (test_p152_facade_abi_and_authority_boundary.py)
        run: |
          mkdir -p branch_output
          python -m pytest -q tests/test_p152_facade_abi_and_authority_boundary.py --junitxml=branch_output/gate_scope_abi_guards_junit.xml
      - name: Operator UI / Brief offline regression (no live broker or LLM)
        env:
          DRY_RUN: '1'
          TRADING_MODE: 'mock'
        run: |
          mkdir -p branch_output
          set +e
          # One documented platform-specific assertion (hard-coded Windows C:\repo PureWindowsPath expectation) is
          # deselected on Linux ONLY; it still runs in the Windows diagnostic job. Pre-existing, source unchanged
          # since the baseline (see P15-R2-GPT-PRELOCAL-004 evidence: test_operator_ui Windows-path case).
          python -m pytest -q tests/test_operator_ui.py tests/test_operator_summary_reports.py tests/test_operator_visibility_reports.py tests/test_phase3_lifecycle_bundle.py --deselect tests/test_operator_ui.py::test_operator_brief_input_paths_fallback_to_trade_root_not_reports_dir --tb=line --junitxml=branch_output/p153_operator_ui_junit.xml > branch_output/operator_ui.log 2>&1
          code=$?
          set -e
          grep -E "^(FAILED|ERROR) |^/.*Error|Error:" branch_output/operator_ui.log | head -30 | while IFS= read -r line; do echo "::error::${line:0:380}"; done
          tail -n 3 branch_output/operator_ui.log
          exit $code
      - name: Upload JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p15-fast-track-junit
          retention-days: 14
          if-no-files-found: warn
          path: |
            branch_output/gate_*_junit.xml
            branch_output/p153_operator_ui_junit.xml
      - name: P1.5.2 final-acceptance inventory contracts
        run: python -m pytest -q tests/test_p152_integration_acceptance_inventory.py
      - name: Emit source and unresolved local acceptance JSON
        run: python -m scripts.refactor.p152_integration_acceptance --out branch_output/p152_integration_acceptance_snapshot.json
      - name: Upload remote inventory and BLOCKED local gates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p152-integration-open-gates-inventory
          retention-days: 14
          if-no-files-found: error
          path: branch_output/p152_integration_acceptance_snapshot.json
      - name: Conservative prelocal facade compatibility-debt contracts
        run: python -m pytest -q tests/test_p152_prelocal_consumer_debt.py
      - name: Emit 436-symbol conservative consumer and wrapper debt inventory
        run: python -m scripts.refactor.p152_prelocal_consumer_debt --out branch_output/p152_prelocal_consumer_debt.json
      - name: Upload prelocal 436-symbol keep/compatibility review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p152-prelocal-consumer-debt-436
          retention-days: 14
          if-no-files-found: error
          path: branch_output/p152_prelocal_consumer_debt.json
      - name: Test offline immutable snapshot/parity gate (no real inputs)
        run: python -m pytest -q tests/test_p152_snapshot_parity.py
      - name: Produce conservative whole-repository façade consumer index
        run: python -m scripts.refactor.p152_facade_consumer_scan --out branch_output/p152_facade_consumer_static_coverage.json
      - name: Upload static façade consumer evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p152-facade-consumer-static
          retention-days: 14
          if-no-files-found: error
          path: branch_output/p152_facade_consumer_static_coverage.json


  broad_remote_offline:
    name: Repo-wide mock/offline non-heavy regression (manual diagnostic only)
    if: github.event_name == 'workflow_dispatch'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
      TRADING_MODE: 'mock'
      OPENROUTER_API_KEY: ''
      KIWOOM_APP_KEY: ''
      KIWOOM_APP_SECRET: ''
      KIWOOM_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch pinned historic public facade AST baselines in separate sweep job
        run: |
          for commit in \
            2fb4b8fcbaa68c34e80fbdbeb8e009c66d0cbc7c \
            f381772d2118aca6444108fab429e4a0e0fba056 \
            0da31c9e6bbcf1754e1b9b209878dca1c6eda9e3 \
            df57b57acf6380174189ed4b69b3f9f92c638d02 \
            007e7c2ff757181048bac6d467ff76ec9f4ddce1 \
            9242d6e30c1c9917bf434bed99e7cca373876678 \
            52508ade9d0d246fa4e848525fe62f2fe067acb7 \
            183924bdbe2e51723987436b45a48d0e849724db \
            ef22bec761d7f2b01762cb17e3c6523b9df8040c \
            0409687aa76e195bd001d7756419b86b9580c531; do
            git fetch --no-tags --depth=1 origin "$commit"
          done
      - name: Repo-wide offline pytest excluding declared heavy, docker and benchmark
        run: |
          mkdir -p branch_output
          python -m pytest -q tests -m "not heavy and not docker and not benchmark" --disable-warnings --junitxml=branch_output/p152_repo_safe_sweep_junit.xml
      - name: Isolate broad-sweep API route failure in fresh pytest process
        if: always()
        run: python -m pytest -q tests/apps/api/test_isolation.py::test_api_routes_are_get_only
      - name: Preserve offline repo-wide test evidence even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p152-repo-wide-offline-sweep-junit
          retention-days: 14
          if-no-files-found: warn
          path: branch_output/p152_repo_safe_sweep_junit.xml


  windows_prelocal_diagnostics:
    name: Windows hosted path/lock/UI compatibility (manual diagnostic)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
      TRADING_MODE: 'mock'
      OPENROUTER_API_KEY: ''
      KIWOOM_APP_KEY: ''
      KIWOOM_APP_SECRET: ''
      KIWOOM_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Hosted Windows strict owner lock and platform path tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force branch_output | Out-Null
          python -m pytest -q tests/test_closeout_single_owner_guard.py tests/test_market_data_receipts.py tests/test_operator_ui.py tests/test_runtime_entrypoint_common.py tests/test_windows_subprocess.py --disable-warnings --maxfail=15 --junitxml=branch_output/p152_windows_platform_junit.xml
      - name: Hosted Windows API and scanner isolation diagnostics
        if: always()
        shell: pwsh
        run: python -m pytest -q tests/apps/api/test_isolation.py::test_api_routes_are_get_only tests/test_scanner_rank_plumbing_fix.py --disable-warnings
      - name: Upload hosted Windows diagnostic results even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p152-windows-hosted-platform-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: branch_output/p152_windows_platform_junit.xml
