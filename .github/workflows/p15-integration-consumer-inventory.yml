name: P1.5 Integration Readonly Consumer Inventory
on:
  push:
    branches:
      - integration/p15-t4-pr5-convergence-20261015
    paths:
      - scripts/refactor/inventory_p15_consumers.py
      - tests/test_p15_consumer_inventory.py
      - .github/workflows/p15-integration-consumer-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No-side-effect isolated fixture
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q -p no:cacheprovider tests/test_p15_consumer_inventory.py
      - name: Read-only inventory on tracked source
        run: |
          python scripts/refactor/inventory_p15_consumers.py --root . --output "$RUNNER_TEMP/p15_consumer_inventory.json"
      - name: Root artifact reference audit (filename paths only)
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('.')
          paths=[x.decode() for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          suspects=['b.jsonl','_health.json']
          callers={}
          for name in suspects:
              candidate=root/name
              refs=[]
              for p in paths:
                  if p==name or not p.endswith(('.py','.md','.yml','.yaml','.json','.toml','.ps1','.sh','.bat','.cmd','.ts','.tsx','.ini')):
                      continue
                  try:
                      t=(root/p).read_text(encoding='utf-8',errors='replace')
                  except OSError:
                      continue
                  if name in t: refs.append(p)
              if candidate.is_file():
                  with candidate.open('rb') as f:
                      count=sum(1 for _ in f)
                  callers[name]={'bytes':candidate.stat().st_size,'lines':count,'tracked_references':refs[:50],'reference_count':len(refs)}
              else:
                  callers[name]={'present':False,'tracked_references':refs[:50],'reference_count':len(refs)}
          print('ROOT_ARTIFACT_AUDIT='+json.dumps(callers,ensure_ascii=False))
          PY
      - name: Upload bounded inventory
        uses: actions/upload-artifact@v4
        with:
          name: p15-full-repo-static-consumer-inventory
          path: ${{ runner.temp }}/p15_consumer_inventory.json
          retention-days: 7
