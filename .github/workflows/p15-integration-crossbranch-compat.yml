name: P1.5 Integration Reporting and Web Compatibility
on:
  push:
    branches:
      - integration/p15-t4-pr5-convergence-20261015
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reporting-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Combined T4 PR5 Reporting, Scripts and UI API regression (no live execution)
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_reporting_relocation_imports.py \
            tests/test_diagnostics_shared_owners.py \
            tests/test_baseline_shared_owners.py \
            tests/test_diagnostic_queries_work_order01.py \
            tests/test_scripts_issue8_followup.py \
            tests/test_scripts_target_tree_compat_audit.py \
            tests/test_patch_notes_sync.py \
            tests/apps/api/test_patch_notes.py \
            tests/test_trade_report_ai.py \
            tests/test_p166_v1052_candidate_risk_migration.py \
            tests/test_scanner_candidate_risk.py \
            tests/test_operator_ui.py \
            --deselect tests/test_operator_ui.py::test_operator_brief_input_paths_fallback_to_trade_root_not_reports_dir
  baseline-lf-windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
      PRODUCTION_WRITE_AUDIT_MODE: 'full'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline reporting test dependencies
        run: python -m pip install "pytest>=8,<10" -r requirements.txt
      - name: Required native-Windows Q10/Q12 baseline LF byte contract (two parameterizations)
        run: python -m pytest -q -p no:cacheprovider tests/test_baseline_shared_owners.py::test_pipeline_io_facades_preserve_bytes_and_error_contract
  web-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
