name: P1.5 Web Compatibility

on:
  push:
    branches: [integration/p1.5]
    paths:
      - 'apps/web/**'
      - '.github/workflows/p15-integration-crossbranch-compat.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/p15-integration-crossbranch-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p15-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
