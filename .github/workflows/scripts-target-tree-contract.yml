name: Scripts Target Tree Contract

on:
  push:
    branches:
      - refactor/agentra-target-tree
    paths:
      - "scripts/**"
      - "tests/test_scripts_target_tree_compat_audit.py"
      - "docs/refactor/2026-10-15_scripts_bulk_manifest.json"
      - ".github/workflows/scripts-target-tree-contract.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/test_scripts_target_tree_compat_audit.py"
      - "docs/refactor/2026-10-15_scripts_bulk_manifest.json"
      - ".github/workflows/scripts-target-tree-contract.yml"

permissions:
  contents: read

concurrency:
  group: scripts-target-tree-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Static CLI contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify all 141 legacy wrapper targets (no execution)
        shell: bash
        run: python scripts/diagnostics/audit_target_tree_compat.py --json
      - name: Install isolated test runner
        shell: bash
        run: python -m pip install "pytest>=8,<9"
      # Run the isolated, source-only fixture suite OUTSIDE the checkout.
      # Repository conftest production-write snapshots can false-positive on
      # Windows NTFS directory mtime for otherwise scratch-only static tests.
      # The real repository's 141 wrappers were checked in the preceding step.
      - name: Stage source-only unit fixtures in runner temp
        shell: bash
        run: |
          python -c "import os,pathlib,shutil;src=pathlib.Path.cwd();dst=pathlib.Path(os.environ['RUNNER_TEMP'])/'agentra-static-fixtures';(dst/'scripts'/'diagnostics').mkdir(parents=True,exist_ok=True);(dst/'tests').mkdir(parents=True,exist_ok=True);shutil.copy2(src/'scripts'/'diagnostics'/'audit_target_tree_compat.py',dst/'scripts'/'diagnostics'/'audit_target_tree_compat.py');shutil.copy2(src/'tests'/'test_scripts_target_tree_compat_audit.py',dst/'tests'/'test_scripts_target_tree_compat_audit.py');print(dst)"
      - name: Run isolated AST auditor fixture tests
        shell: bash
        run: |
          python -c "import os,pathlib,pytest,sys;p=pathlib.Path(os.environ['RUNNER_TEMP'])/'agentra-static-fixtures'/'tests'/'test_scripts_target_tree_compat_audit.py';sys.exit(pytest.main([str(p),'-q','-p','no:cacheprovider']))"
