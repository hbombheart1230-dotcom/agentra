name: P1.5.1 Reporting Validation

on:
  pull_request:
    branches:
      - codex/p1.5.1-reporting-dead-code-20261007

jobs:
  reporting-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Required P1.5.1 suite
        run: python -m pytest -q tests/test_trade_report_ai.py tests/test_trade_summary_symbol_metadata.py tests/test_reporting_provenance_preference.py
      - name: Separated adapter
        continue-on-error: true
        run: python -m pytest -q tests/test_trade_report_ai_separated_adapter.py
      - name: Trade story enrichment
        continue-on-error: true
        run: python -m pytest -q tests/test_trade_story_pipeline_enrichment.py
      - name: AI report batch
        continue-on-error: true
        run: python -m pytest -q tests/test_run_ai_trade_report_batch.py
      - name: Live execution bundle
        continue-on-error: true
        run: python -m pytest -q tests/test_live_execution_bundle_report.py
      - name: Runtime regression checker
        continue-on-error: true
        run: python -m pytest -q tests/test_check_trade_report_runtime_regression.py
      - name: Report metadata alignment
        continue-on-error: true
        run: python -m pytest -q tests/test_report_metadata_alignment.py
